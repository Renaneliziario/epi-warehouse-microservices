server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/db_operacao
    driverClassName: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

servico-retirada-epi:
  url: ${SERVICO_RETIRADA_EPI_URL:http://localhost:8083}
